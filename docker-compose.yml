# ==============================================================================
# AlumniConnect Full-Stack Docker Compose Orchestration
# ==============================================================================
version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # MySQL Database Service
  # ----------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: alumniconnect-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: alumniconnect
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: alumni_user
      MYSQL_PASSWORD: alumni_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed-data.sql:/docker-entrypoint-initdb.d/02-seed-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - alumniconnect-network

  # ----------------------------------------------------------------------------
  # Spring Boot Backend API Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./alumniconnect-backend
      dockerfile: Dockerfile
    container_name: alumniconnect-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/alumniconnect?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: root
      JWT_SECRET: ProductionJwtSecretKeyForAlumniConnectWhichMustBeAtLeast256BitsLongHS256Algorithm
      JWT_EXPIRATION_MS: 86400000
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
    ports:
      - "8080:8080"
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - alumniconnect-network

  # ----------------------------------------------------------------------------
  # React + Vite Frontend (Nginx Reverse Proxy)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./alumniconnect-frontend
      dockerfile: Dockerfile
    container_name: alumniconnect-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "5173:80"
    networks:
      - alumniconnect-network

# ------------------------------------------------------------------------------
# Persistent Storage Volumes & Networks
# ------------------------------------------------------------------------------
volumes:
  mysql-data:
    name: alumniconnect-mysql-data
  backend-uploads:
    name: alumniconnect-backend-uploads

networks:
  alumniconnect-network:
    name: alumniconnect-network
    driver: bridge
