name: AlumniConnect Continuous Integration & Delivery

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Backend CI (Spring Boot 3 + Java 21)
  # ----------------------------------------------------------------------------
  backend-ci:
    name: Build & Test Backend (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven Local Repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('alumniconnect-backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Compile and Run Unit & Integration Tests
        working-directory: ./alumniconnect-backend
        run: mvn clean test -B

      - name: Package Spring Boot Executable JAR
        working-directory: ./alumniconnect-backend
        run: mvn package -DskipTests -B

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: alumniconnect-backend-jar
          path: alumniconnect-backend/target/*.jar
          retention-days: 7

  # ----------------------------------------------------------------------------
  # Job 2: Frontend CI (React + Vite + Tailwind CSS)
  # ----------------------------------------------------------------------------
  frontend-ci:
    name: Build & Verify Frontend (React 18)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./alumniconnect-frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./alumniconnect-frontend
        run: npm ci

      - name: Build Vite Production Bundle
        working-directory: ./alumniconnect-frontend
        run: npm run build

      - name: Upload Frontend Static Dist
        uses: actions/upload-artifact@v4
        with:
          name: alumniconnect-frontend-dist
          path: alumniconnect-frontend/dist/
          retention-days: 7

  # ----------------------------------------------------------------------------
  # Job 3: Docker Container Build Verification
  # ----------------------------------------------------------------------------
  docker-build:
    name: Verify Docker Container Builds
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: docker build -t alumniconnect-backend:latest ./alumniconnect-backend

      - name: Build Frontend Docker Image
        run: docker build -t alumniconnect-frontend:latest ./alumniconnect-frontend
